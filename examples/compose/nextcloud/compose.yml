name: nextcloud-aio

services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:<PINNED_VERSION>
    init: true
    restart: unless-stopped
    container_name: nextcloud-aio-mastercontainer
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: bridge
    ports:
      - "127.0.0.1:${NEXTCLOUD_AIO_PORT:-8080}:80"
      - "127.0.0.1:${NEXTCLOUD_AIO_ADMIN_PORT:-8081}:8080"
      - "127.0.0.1:${NEXTCLOUD_APACHE_PORT:-11000}:8443"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    environment:
      APACHE_PORT: ${NEXTCLOUD_APACHE_PORT:-11000}
      APACHE_IP_BINDING: 127.0.0.1
      NEXTCLOUD_MOUNT: ${DATA_ROOT}
      SKIP_DOMAIN_VALIDATION: "false"

volumes:
  nextcloud_aio_mastercontainer:
